services:
  - type: web
    name: attendance-backend
    runtime: docker
    region: oregon
    plan: free
    dockerfile: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 5000
      - key: SMS_MOCK
        value: "true"
    autoDeploy: true
